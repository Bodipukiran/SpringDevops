# =====================================================================
# docker-compose.yml
#
# Brings up the full stack for local development / DevOps demo purposes:
#   - mysql       : the application's database
#   - app         : the Spring Boot Student Management System itself
#   - prometheus  : scrapes metrics from the app's /actuator/prometheus endpoint
#   - grafana     : visualizes the metrics Prometheus has collected
#
# Run everything with:  docker compose up --build
# Tear everything down:  docker compose down -v
# =====================================================================

services:

  mysql:
    image: mysql:8.0
    container_name: sms-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: student_management_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - sms-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sms-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # Overrides application.properties defaults so the app talks to the
      # "mysql" service (container-to-container DNS name) instead of localhost.
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/student_management_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    ports:
      - "8080:8080"
    networks:
      - sms-network

  prometheus:
    image: prom/prometheus:latest
    container_name: sms-prometheus
    restart: unless-stopped
    depends_on:
      - app
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - sms-network

  grafana:
    image: grafana/grafana:latest
    container_name: sms-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - sms-network

networks:
  sms-network:
    driver: bridge

volumes:
  mysql_data:
  prometheus_data:
  grafana_data:
