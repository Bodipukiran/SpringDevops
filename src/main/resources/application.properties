# ==============================================================
# Student Management System - main application configuration
# ==============================================================

spring.application.name=student-management-system


# ---------------- Server ----------------
server.port=8081


# ---------------- MySQL DataSource ----------------
# Docker container -> Windows host -> MySQL container
# MySQL container is exposed on port 3307 on the host

spring.datasource.url=jdbc:mysql://host.docker.internal:3307/student_management_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=YourNewPassword123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ---------------- JPA / Hibernate ----------------

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false


# ---------------- Jackson ----------------

spring.jackson.default-property-inclusion=non_null


# ---------------- Actuator ----------------

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always


# Prometheus scrape endpoint
management.prometheus.metrics.export.enabled=true


# ---------------- Info endpoint ----------------

info.app.name=Student Management System
info.app.description=Spring Boot 3 + MySQL CRUD REST API for managing students
info.app.version=1.0.0
