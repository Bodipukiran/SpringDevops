# ==============================================================
# Student Management System - main application configuration
# ==============================================================

spring.application.name=student-management-system

# ---------------- Server ----------------
server.port=8081

# ---------------- MySQL DataSource ----------------
# When running via docker-compose, SPRING_DATASOURCE_URL/USERNAME/PASSWORD
# environment variables (see docker-compose.yml) override these defaults so
# the app can reach the "mysql" service by container name instead of localhost.
spring.datasource.url=jdbc:mysql://localhost:3306/student_management_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=YourNewPassword123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------- JPA / Hibernate ----------------
# ddl-auto=update: Hibernate creates/updates the "students" table automatically
# from the Student entity on startup - convenient for a class project/demo.
# Use "validate" or Flyway/Liquibase migrations instead in a real production system.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ---------------- Jackson ----------------
spring.jackson.default-property-inclusion=non_null

# ---------------- Actuator ----------------
# Exposes health, info, metrics and the Prometheus scrape endpoint over HTTP.
# In a real production system you would normally lock this down (put it on a
# separate management port and/or behind auth) - left open here for the
# DevOps/viva demo.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# Prometheus scrape endpoint: GET /actuator/prometheus
management.prometheus.metrics.export.enabled=true

# ---------------- Info endpoint (GET /actuator/info) ----------------
info.app.name=Student Management System
info.app.description=Spring Boot 3 + MySQL CRUD REST API for managing students
info.app.version=1.0.0
