# ==============================================================
# Test-only configuration.
#
# Tests run against an in-memory H2 database instead of MySQL so the test
# suite is self-contained and doesn't require a running MySQL server (e.g.
# in Jenkins/CI). H2 speaks enough MySQL-compatible SQL for this simple
# schema via MODE=MySQL.
# ==============================================================

spring.datasource.url=jdbc:h2:mem:student_management_test_db;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
